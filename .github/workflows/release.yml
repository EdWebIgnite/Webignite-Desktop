name: Release

# Every merge to main builds the Windows installer and publishes it as a GitHub release, numbered
# 0.2.<run>. It can also be started by hand from the Actions tab (Run workflow).
# Installed copies of Webignite find the new release on their next start and offer a restart.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Webignite.slnx -c Release
      - run: dotnet test --solution Webignite.slnx -c Release --no-build
      - name: Publish both apps into one folder
        shell: pwsh
        run: |
          $v = "0.2.${{ github.run_number }}"
          dotnet publish src/Webignite.Desktop -c Release -r win-x64 --self-contained -p:Version=$v -o publish
          dotnet publish src/Webignite.Connector -c Release -r win-x64 --self-contained -p:Version=$v -o publish
          Remove-Item publish/*.pdb
      - run: dotnet tool install -g vpk --version 1.2.161
      - name: Pack and publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "0.2.${{ github.run_number }}"
          $repo = "https://github.com/${{ github.repository }}"
          vpk download github --repoUrl $repo --token $env:GH_TOKEN
          vpk pack --packId WebigniteDesktop --packVersion $v --packDir publish --mainExe Webignite.exe --packTitle Webignite --packAuthors Webignite --icon src/Webignite.Desktop/Assets/webignite.ico
          vpk upload github --repoUrl $repo --token $env:GH_TOKEN --publish --releaseName "Webignite $v" --tag "v$v" --targetCommitish "${{ github.sha }}"

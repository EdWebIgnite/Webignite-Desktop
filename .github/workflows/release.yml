name: Release

# Every merge to main, once "Build and test" has passed for it, builds the Windows installer and publishes it
# as a GitHub release, numbered 0.2.<run>. It can also be started by hand from the Actions tab (Run workflow).
# Installed copies of Webignite find the new release on their next start and offer a restart.
on:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Only after a passing build and test of a push to main (not a pull request), or when started by hand.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit that was built and tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish both apps into one folder
        shell: pwsh
        run: |
          $v = "0.2.${{ github.run_number }}"
          dotnet publish src/Webignite.Desktop -c Release -r win-x64 --self-contained -p:Version=$v -o publish
          dotnet publish src/Webignite.Connector -c Release -r win-x64 --self-contained -p:Version=$v -o publish
          Remove-Item publish/*.pdb
      - name: Install vpk at the same version as the Velopack package
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Packages.props
          $version = ($props.Project.ItemGroup.PackageVersion | Where-Object { $_.Include -eq 'Velopack' }).Version
          dotnet tool install -g vpk --version $version
      - name: Pack and publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "0.2.${{ github.run_number }}"
          $repo = "https://github.com/${{ github.repository }}"
          vpk download github --repoUrl $repo --token $env:GH_TOKEN
          vpk pack --packId WebigniteDesktop --packVersion $v --packDir publish --mainExe Webignite.exe --packTitle Webignite --packAuthors Webignite --icon src/Webignite.Desktop/Assets/webignite.ico
          vpk upload github --repoUrl $repo --token $env:GH_TOKEN --publish --releaseName "Webignite $v" --tag "v$v" --targetCommitish "${{ github.event.workflow_run.head_sha || github.sha }}"

name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Webignite.slnx -c Release
      - run: dotnet test --solution Webignite.slnx -c Release --no-build

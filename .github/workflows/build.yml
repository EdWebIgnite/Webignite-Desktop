name: Build and test

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request cancels the run still going for the older one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build Webignite.slnx -c Release
      - run: dotnet test --solution Webignite.slnx -c Release --no-build

  # The tests again on Linux, then every screen drawn by the screenshot tool. A screen that fails to load,
  # or a check in the tool that fails, fails the run. The pictures are kept with the run to look at.
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build Webignite.slnx -c Release
      - run: dotnet test --solution Webignite.slnx -c Release --no-build
      - run: dotnet run --project tools/Snapshot -c Release --no-build -- screenshots
      # Light by design: start-up time and memory against tools/Measure/limits.json, and every page must give
      # its memory back when let go. The numbers go in the run's summary.
      - run: dotnet run --project tools/Measure -c Release --no-build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
